<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Computech</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- THEME CONFIGURATION --- */
        :root {
            --bg-dark: #050505;
            --gold-mid: #C5A059;   
            --gold-dark: #8B6914;  
        }

        .bg-texture {
            background-color: var(--bg-dark);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        body { font-family: 'Inter', sans-serif; color: #e5e5e5; }
        .font-tech { font-family: 'Rajdhani', sans-serif; }

        input, textarea, select { text-transform: uppercase !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-mid); }

        /* Metallic Text Effects */
        .text-gold-metallic {
            background: linear-gradient(to bottom, #FCEFA0 10%, #C5A059 50%, #8B6914 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0px rgba(0,0,0,0.5));
        }

        .bg-gold-gradient {
            background: linear-gradient(135deg, #C5A059 0%, #8B6914 100%);
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .bg-gold-gradient:hover { background: linear-gradient(135deg, #D4AF37 0%, #A07818 100%); }

        /* --- PAPER SHEET (PRINT) STYLES --- */
        .paper-sheet {
            width: 297mm; 
            height: 209mm; /* A4 Landscape */
            display: flex; 
            flex-direction: row;
            background: white; 
            color: black; 
            overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform-origin: center top; 
        }

        .print-sidebar {
            background-color: #080808 !important;
            border-right: 1px solid #C5A059 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .print-gold-text { color: #C5A059 !important; -webkit-print-color-adjust: exact; }
        .print-gold-bg { background-color: #C5A059 !important; -webkit-print-color-adjust: exact; }
        .print-black-header { background-color: #000 !important; color: white !important; -webkit-print-color-adjust: exact; }
        .print-border-gold { border-color: #C5A059 !important; -webkit-print-color-adjust: exact; }
        .print-row-border { border-bottom: 1px solid #a3a3a3 !important; }
        .print-col-border { border-right: 1px solid #a3a3a3 !important; }
        .table-clean { border: none !important; }

        /* --- MOBILE VIEW --- */
        @media (max-width: 768px) {
            #quote-viewer-content {
                transform: scale(0.42); 
                transform-origin: top left;
                margin-left: 5%;
            }
        }

        @media print {
            @page { size: A4 landscape; margin: 0; }
            html, body { width: 297mm; height: 210mm; margin: 0 !important; padding: 0 !important; background: white; overflow: hidden !important; }
            #app-layout, #loading-screen, #quote-viewer-toolbar { display: none !important; }
            #quote-viewer { display: block !important; position: absolute !important; left: 0 !important; top: 0 !important; width: 297mm !important; height: 210mm !important; background: white !important; z-index: 9999; overflow: hidden !important; }
            .paper-sheet { box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important; position: absolute; top: 0; left: 0; transform: none !important; }
        }
    </style>
</head>
<body class="bg-texture overflow-hidden h-screen selection:bg-[#C5A059] selection:text-black">

    <div id="loading-screen" class="fixed inset-0 bg-[#050505] flex items-center justify-center z-50">
        <div class="flex flex-col items-center animate-pulse">
            <div class="text-7xl font-black font-tech tracking-tighter italic text-gold-metallic mb-4" style="transform: skew(-10deg);">ACE</div>
            <div class="text-neutral-500 font-bold font-tech tracking-[0.3em] text-sm">LOADING ENGINE...</div>
        </div>
    </div>

    <div id="app-layout" class="hidden flex h-screen">
        <aside class="w-64 bg-[#0a0a0a] border-r border-[#1a1a1a] flex flex-col z-20 print:hidden relative">
            <div class="p-6 flex items-center gap-3 border-b border-[#1a1a1a] relative z-10">
                <h1 class="text-5xl font-black font-tech italic text-gold-metallic leading-none tracking-tighter" style="transform: skew(-10deg);">ACE</h1>
            </div>
            <nav class="flex-1 p-4 space-y-1 relative z-10" id="sidebar-nav"></nav>
            <div class="p-4 border-t border-[#1a1a1a] relative z-10">
                <div class="flex items-center gap-3 px-3 py-2 text-sm text-neutral-400 bg-[#111] border border-[#222]">
                    <div class="w-8 h-8 bg-gradient-to-br from-[#C5A059] to-[#8B6914] flex items-center justify-center text-white font-bold text-xs shadow-lg">A</div>
                    <div>
                        <p class="truncate font-bold text-[#C5A059] font-tech uppercase tracking-wider">Admin</p>
                        <p class="text-[10px] text-neutral-500 uppercase">● Online</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 overflow-auto relative" id="main-content">
            <div id="view-dashboard" class="view-section p-8 max-w-7xl mx-auto"></div>
            <div id="view-create" class="view-section hidden p-8 max-w-6xl mx-auto h-full overflow-auto"></div>
            <div id="view-create-bill" class="view-section hidden p-8 max-w-6xl mx-auto h-full overflow-auto"></div>
            <div id="view-quotes" class="view-section hidden p-8 max-w-7xl mx-auto h-full flex flex-col"></div>
            <div id="view-billing" class="view-section hidden p-8 max-w-5xl mx-auto h-full overflow-auto"></div>
            <div id="view-settings" class="view-section hidden p-8 max-w-4xl mx-auto h-full overflow-auto"></div>
        </main>
    </div>

    <div id="quote-viewer" class="hidden fixed inset-0 bg-black z-50 overflow-auto flex flex-col">
        <div id="quote-viewer-toolbar" class="bg-[#111] border-b border-[#222] px-8 py-4 flex justify-between items-center sticky top-0 z-10">
            <button id="btn-viewer-back" class="flex items-center gap-2 text-neutral-400 hover:text-[#C5A059] font-tech font-bold uppercase transition-colors">
                <i data-lucide="arrow-left"></i> Back to Builder
            </button>
            <div class="flex gap-3">
                <button onclick="window.print()" class="bg-gold-gradient px-6 py-2 uppercase font-tech font-bold tracking-wider hover:brightness-110 shadow-[0_0_15px_rgba(197,160,89,0.3)] flex items-center gap-2 rounded-sm text-sm">
                    <i data-lucide="printer" size="16"></i> Print / Save PDF
                </button>
            </div>
        </div>
        <div class="flex-1 p-8 overflow-auto flex justify-center bg-[#050505] print:bg-white print:p-0">
            <div id="quote-viewer-content" class="paper-sheet relative text-sm text-black"></div>
        </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const BLUEPRINT_ITEMS = [
            "CPU", "GRAPHICS CARD", "MOTHERBOARD", "RAM", "STORAGE 1", 
            "STORAGE 2", "CPU COOLER", "PSU", "CABINET", "CABINET FANS",
            "MONITOR", "KEYBOARD", "MOUSE", "HEADPHONES", "OTHERS"
        ];
        const DB_KEY = 'ace_computech_metallic_v10_final';

        // --- STATE ---
        const state = {
            activeTab: 'dashboard',
            quotations: [],
            bills: [], 
            settings: {
                companyName: 'ACE COMPUTECH',
                email: 'acepcintegrator@gmail.com',
                address: '9-5-102/A, OTV Office, Hyderabad - 500031',
                phone: '97048-12052',
                gst: '', 
                logoUrl: '' 
            },
            componentLibrary: {}, // STORES LEARNED ITEMS
            editingQuote: null,
            editingBill: null,
        };

        const dom = {
            loading: document.getElementById('loading-screen'),
            app: document.getElementById('app-layout'),
            sidebarNav: document.getElementById('sidebar-nav'),
            views: {
                dashboard: document.getElementById('view-dashboard'),
                create: document.getElementById('view-create'),
                createBill: document.getElementById('view-create-bill'),
                quotes: document.getElementById('view-quotes'),
                billing: document.getElementById('view-billing'),
                settings: document.getElementById('view-settings'),
            },
            quoteViewer: document.getElementById('quote-viewer'),
            quoteViewerContent: document.getElementById('quote-viewer-content'),
            btnViewerBack: document.getElementById('btn-viewer-back')
        };

        // --- CORE FUNCTIONS ---
        function init() {
            loadData();
            setTimeout(() => {
                dom.loading.classList.add('hidden');
                dom.app.classList.remove('hidden');
                renderSidebar();
                navigateTo('dashboard');
            }, 800);
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(DB_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.quotations = parsed.quotations || [];
                    state.bills = parsed.bills || []; 
                    if(parsed.settings) state.settings = { ...state.settings, ...parsed.settings };
                    if(parsed.componentLibrary) state.componentLibrary = parsed.componentLibrary;
                }
            } catch (e) { console.error("Data load error", e); }
        }

        function saveData() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify({
                    quotations: state.quotations,
                    bills: state.bills, 
                    settings: state.settings,
                    componentLibrary: state.componentLibrary
                }));
            } catch (e) { alert("STORAGE FULL! Please delete old data."); }
        }

        // --- AUTO-LEARN LOGIC ---
        function updateLibrary(items) {
            let hasNewItems = false;
            items.forEach(item => {
                const cat = item.category;
                const name = item.name ? item.name.trim().toUpperCase() : '';
                if(name && name.length > 2) { // Only save if longer than 2 chars
                    if(!state.componentLibrary[cat]) state.componentLibrary[cat] = [];
                    if(!state.componentLibrary[cat].includes(name)) {
                        state.componentLibrary[cat].push(name);
                        state.componentLibrary[cat].sort(); // Keep alphabetized
                        hasNewItems = true;
                    }
                }
            });
            // Note: We don't call saveData() here because it's called immediately after by the parent function
            return hasNewItems;
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear().toString().slice(-2); 
            return `${day}/${month}/${year}`;
        }
        
        function formatCurrency(amount) {
            return parseFloat(amount || 0).toLocaleString('en-IN');
        }

        function navigateTo(tabName) {
            state.activeTab = tabName;
            Object.values(dom.views).forEach(el => el.classList.add('hidden'));
            if (dom.views[tabName]) {
                dom.views[tabName].classList.remove('hidden');
                if (tabName === 'dashboard') renderDashboard();
                if (tabName === 'quotes') renderQuotesList();
                if (tabName === 'create') renderQuoteBuilder();
                if (tabName === 'createBill') renderBillBuilder(); 
                if (tabName === 'billing') renderBillingTab(); 
                if (tabName === 'settings') renderSettings();
            }
            renderSidebar();
        }

        window.handleNav = (id) => {
            if (id === 'create') state.editingQuote = null; 
            if (id === 'createBill') state.editingBill = null; 
            navigateTo(id);
        };

        // --- SIDEBAR ---
        function renderSidebar() {
            const items = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
                { id: 'create', icon: 'plus-circle', label: state.editingQuote ? 'Edit Quotation' : 'New Quotation' },
                { id: 'quotes', icon: 'file-text', label: 'Quote History' },
                { type: 'header', label: 'Finance' },
                { id: 'billing', icon: 'receipt', label: 'Billing / Invoice' }, 
                { type: 'header', label: 'System' },
                { id: 'settings', icon: 'settings', label: 'Settings' }
            ];

            dom.sidebarNav.innerHTML = items.map(item => {
                if (item.type === 'header') return `<div class="pt-6 pb-2 text-[10px] font-bold text-[#555] uppercase tracking-[0.2em] pl-4 font-tech border-b border-[#1a1a1a] mb-2">${item.label}</div>`;
                const active = state.activeTab === item.id;
                return `
                    <button onclick="window.handleNav('${item.id}')" 
                        class="w-full flex items-center gap-3 px-4 py-3 border-l-2 transition-all duration-300 group ${active ? 'border-[#C5A059] bg-[#111] text-[#C5A059]' : 'border-transparent text-neutral-500 hover:text-[#F3E5AB] hover:bg-[#0e0e0e]'}">
                        <i data-lucide="${item.icon}" size="18" class="${active ? 'text-[#C5A059]' : 'text-neutral-600 group-hover:text-[#F3E5AB]'}"></i>
                        <span class="font-bold font-tech uppercase tracking-wider text-sm">${item.label}</span>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            dom.views.dashboard.innerHTML = `
                <header class="mb-10 border-b border-[#222] pb-6">
                    <h2 class="text-5xl font-black text-white font-tech uppercase tracking-tighter italic">Command <span class="text-gold-metallic">Center</span></h2>
                    <p class="text-neutral-600 mt-2 font-mono text-xs">SYSTEM STATUS: ONLINE // USER: ADMIN</p>
                </header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-[#0c0c0c] p-6 border-l-4 border-[#8B6914] shadow-lg group hover:bg-[#111] transition-colors relative overflow-hidden">
                        <div class="flex items-center gap-4 relative z-10">
                            <div class="p-4 bg-black border border-[#222] text-[#C5A059] shadow-inner"><i data-lucide="file-text"></i></div>
                            <div><p class="text-neutral-500 text-[10px] uppercase tracking-widest font-bold">Total Quotes</p><h3 class="text-4xl font-black text-white font-tech italic">${state.quotations.length}</h3></div>
                        </div>
                    </div>
                    <div class="bg-[#0c0c0c] p-6 border-l-4 border-[#8B6914] shadow-lg group hover:bg-[#111] transition-colors relative overflow-hidden">
                        <div class="flex items-center gap-4 relative z-10">
                            <div class="p-4 bg-black border border-[#222] text-[#C5A059] shadow-inner"><i data-lucide="receipt"></i></div>
                            <div><p class="text-neutral-500 text-[10px] uppercase tracking-widest font-bold">Total Bills</p><h3 class="text-4xl font-black text-white font-tech italic">${state.bills.length}</h3></div>
                        </div>
                    </div>
                </div>
                <div class="bg-[#111] p-4 border border-[#222] rounded-sm">
                    <h4 class="text-[#C5A059] font-bold uppercase text-xs tracking-widest mb-2"><i data-lucide="brain-circuit" class="inline w-4 h-4 mr-1"></i> Auto-Learn Status</h4>
                    <p class="text-neutral-500 text-xs">System has learned <span class="text-white font-bold">${Object.values(state.componentLibrary).flat().length}</span> unique components across categories.</p>
                </div>
            `;
            lucide.createIcons();
        }

        // --- BILLING TAB ---
        function renderBillingTab() {
            const sortedBills = [...state.bills].sort((a,b) => new Date(b.date) - new Date(a.date));
            dom.views.billing.innerHTML = `
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black text-white font-tech uppercase italic">Billing <span class="text-gold-metallic">Terminal</span></h2>
                </div>
                <div class="mb-10">
                    <button onclick="window.handleNav('createBill')" class="w-full md:w-auto bg-gold-gradient px-8 py-5 uppercase font-tech font-bold tracking-wider hover:brightness-110 shadow-[0_0_20px_rgba(197,160,89,0.2)] flex items-center justify-center gap-3 text-lg rounded-sm transition-all transform hover:scale-[1.01]">
                        <i data-lucide="plus-circle" size="24"></i> Create New Invoice Manually
                    </button>
                    <p class="mt-2 text-xs text-neutral-500 font-mono">* Opens Invoice Builder for manual entry.</p>
                </div>
                <div class="mt-8 border-t border-[#222] pt-8">
                    <div class="flex justify-between items-end mb-6">
                        <h3 class="text-xl font-black text-white font-tech uppercase italic">Invoice History</h3>
                        <div class="relative w-full max-w-md">
                            <i data-lucide="search" class="absolute left-3 top-3 text-neutral-500 w-5 h-5"></i>
                            <input type="text" onkeyup="window.handleBillHistorySearch(this.value)" placeholder="Search..." 
                                class="w-full bg-[#080808] border border-[#222] text-white rounded-none pl-10 pr-4 py-2 focus:border-[#C5A059] outline-none font-tech tracking-wide placeholder-neutral-600 transition-colors">
                        </div>
                    </div>
                    <div class="bg-[#0c0c0c] border border-[#222] overflow-hidden">
                        <table class="w-full text-left text-sm text-neutral-400">
                            <thead class="bg-[#080808] text-neutral-500 border-b border-[#222] font-tech uppercase tracking-widest text-xs">
                                <tr><th class="p-4">Date</th><th class="p-4">Invoice No</th><th class="p-4">Client</th><th class="p-4 text-right">Amount</th><th class="p-4 text-right">Actions</th></tr>
                            </thead>
                            <tbody class="divide-y divide-[#1a1a1a]" id="bill-history-table-body"></tbody>
                        </table>
                    </div>
                </div>
            `;
            renderBillRows(sortedBills);
            lucide.createIcons();
        }

        function renderBillRows(data) {
             const tbody = document.getElementById('bill-history-table-body');
             if(!tbody) return;
             if (data.length === 0) {
                 tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-neutral-600 font-mono text-xs">NO RECORDS FOUND</td></tr>`;
                 return;
             }
             tbody.innerHTML = data.map(b => `
                <tr class="hover:bg-[#111] transition-colors">
                    <td class="p-4 font-mono text-xs">${formatDate(b.date)}</td>
                    <td class="p-4 font-bold text-[#8B6914] font-mono text-xs">${b.invoiceNumber}</td>
                    <td class="p-4 font-bold text-white font-tech uppercase">${b.clientName}</td>
                    <td class="p-4 text-right font-bold font-tech text-lg text-[#C5A059]">₹${formatCurrency(b.total)}</td>
                    <td class="p-4 text-right">
                        <button onclick="window.viewQuote('${b.id}', 'saved-bill')" class="text-neutral-500 hover:text-[#C5A059] mr-2 transition-colors inline-flex"><i data-lucide="printer" size="16"></i></button>
                        <button onclick="window.editBill('${b.id}')" class="text-blue-500 hover:text-white mr-2 transition-colors inline-flex"><i data-lucide="pencil" size="16"></i></button>
                        <button onclick="window.deleteBill('${b.id}')" class="text-red-900 hover:text-red-500 transition-colors inline-flex"><i data-lucide="trash-2" size="16"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        window.handleBillHistorySearch = (query) => {
            const lower = query.toLowerCase();
            const filtered = state.bills.filter(b => {
                return (b.clientName.toLowerCase().includes(lower) || b.invoiceNumber.toLowerCase().includes(lower) || formatDate(b.date).includes(lower) || b.total.toString().includes(lower));
            });
            renderBillRows(filtered);
        };

        window.deleteBill = (id) => {
            if(confirm('Are you sure you want to delete this invoice?')) {
                state.bills = state.bills.filter(b => b.id !== id);
                saveData();
                renderBillingTab();
            }
        };

        window.editBill = (id) => {
            state.editingBill = state.bills.find(b => b.id === id);
            navigateTo('createBill');
        };

        // --- BUILDERS ---
        let builderItems = [];

        function renderQuoteBuilder() {
            const isEdit = !!state.editingQuote;
            const data = state.editingQuote || {};
            builderItems = isEdit ? JSON.parse(JSON.stringify(data.items)) : BLUEPRINT_ITEMS.map(cat => ({ id: Date.now() + Math.random(), category: cat, name: '', imageUrl: '' }));
            const todayISO = new Date().toISOString().split('T')[0];
            const dateVal = isEdit && data.quoteDate ? data.quoteDate.split('T')[0] : todayISO;
            const validVal = isEdit && data.validUntil ? data.validUntil.split('T')[0] : todayISO;
            dom.views.create.innerHTML = getBuilderHTML('quote', isEdit, data, dateVal, validVal);
            renderBuilderItems('quote');
        }

        function renderBillBuilder() {
            const isEdit = !!state.editingBill; 
            const data = state.editingBill || {};
            builderItems = isEdit ? JSON.parse(JSON.stringify(data.items)) : BLUEPRINT_ITEMS.map(cat => ({ id: Date.now() + Math.random(), category: cat, name: '', imageUrl: '' }));
            const todayISO = new Date().toISOString().split('T')[0];
            const dateVal = isEdit && data.date ? data.date.split('T')[0] : todayISO;
            dom.views.createBill.innerHTML = getBuilderHTML('bill', isEdit, data, dateVal, null);
            renderBuilderItems('bill');
        }

        function getBuilderHTML(type, isEdit, data, dateVal, validVal) {
            const isQuote = type === 'quote';
            const title = isQuote ? (isEdit ? 'Modify Config' : 'Initialize Build') : 'Invoice Entry';
            const saveFunc = isQuote ? 'window.saveQuote()' : 'window.saveManualBill()';
            const discardFunc = isQuote ? "window.handleNav('quotes')" : "window.handleNav('billing')";
            const refVal = isQuote ? (data.quoteNumber || 'AUTO-GEN') : (data.invoiceNumber || 'AUTO-GEN');
            const listId = isQuote ? 'qb-items-list' : 'bb-items-list';
            
            // PERMANENT GST CHANGE: Always true
            const isGstApplied = true;

            return `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-black text-white font-tech uppercase italic">${title}</h2>
                    <div class="flex gap-2">
                        <button onclick="${discardFunc}" class="px-4 py-2 text-neutral-500 hover:text-white font-tech uppercase font-bold tracking-wider">Discard</button>
                        <button onclick="${saveFunc}" class="bg-gold-gradient px-6 py-2 uppercase font-tech font-bold tracking-wider shadow-[0_0_15px_rgba(197,160,89,0.3)] flex items-center gap-2 rounded-sm text-sm">
                            <i data-lucide="save" size="16"></i> ${isQuote ? 'Save Quote' : 'Save Invoice'}
                        </button>
                    </div>
                </div>
                <div class="bg-[#0c0c0c] p-6 border border-[#222] mb-6 relative">
                    <div class="absolute top-0 left-0 w-2 h-full bg-[#8B6914]"></div>
                    <h3 class="font-bold text-[#C5A059] mb-4 flex items-center gap-2 font-tech uppercase tracking-widest text-lg">Client Data</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div><label class="block text-[10px] text-neutral-500 uppercase tracking-widest mb-1">Entity Name</label><input id="${type}-c-name" value="${data.clientName || ''}" class="w-full p-2 bg-[#050505] border border-[#333] text-white focus:border-[#C5A059] outline-none font-tech text-lg transition-colors"></div>
                        <div><label class="block text-[10px] text-neutral-500 uppercase tracking-widest mb-1">Contact</label><input id="${type}-c-contact" value="${data.clientContact || ''}" class="w-full p-2 bg-[#050505] border border-[#333] text-white focus:border-[#C5A059] outline-none font-tech text-lg transition-colors"></div>
                        <div><label class="block text-[10px] text-neutral-500 uppercase tracking-widest mb-1">Date</label><input id="${type}-date" type="date" value="${dateVal}" class="w-full p-2 bg-[#050505] border border-[#333] text-white focus:border-[#C5A059] outline-none text-sm font-mono uppercase"></div>
                        ${isQuote ? `<div><label class="block text-[10px] text-neutral-500 uppercase tracking-widest mb-1">Valid Until</label><input id="quote-valid" type="date" value="${validVal}" class="w-full p-2 bg-[#050505] border border-[#333] text-white focus:border-[#C5A059] outline-none text-sm font-mono uppercase"></div>` : ''}
                        <div><label class="block text-[10px] text-neutral-500 uppercase tracking-widest mb-1">${isQuote ? 'Quote Ref' : 'Invoice No'}</label><input disabled value="${refVal}" class="w-full p-2 bg-black border border-[#222] text-neutral-600 font-mono text-xs"></div>
                    </div>
                </div>
                <div class="bg-[#0c0c0c] border border-[#222] overflow-hidden mb-6">
                    <div class="p-4 bg-[#080808] border-b border-[#222]"><h3 class="font-bold text-white font-tech uppercase tracking-widest">System Architecture</h3></div>
                    <div id="${listId}" class="divide-y divide-[#1a1a1a]"></div>
                </div>
                <div class="flex justify-end">
                    <div class="w-full md:w-1/3 bg-[#0c0c0c] p-6 border border-[#222]">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-bold text-sm text-neutral-500 uppercase tracking-widest">Price Includes GST (18%)?</span>
                            <input type="checkbox" id="${type}-gst-toggle" checked disabled class="w-5 h-5 accent-[#C5A059] cursor-not-allowed opacity-70">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xl text-white font-tech uppercase italic">Final Total</span>
                            <div class="flex items-center text-[#C5A059]">
                                <span class="text-xl font-bold mr-1">₹</span>
                                <input id="${type}-manual-total" type="number" value="${data.total || ''}" placeholder="0" class="w-32 text-right bg-transparent border-b-2 border-[#8B6914] text-3xl font-black font-tech text-white focus:outline-none focus:border-[#C5A059]">
                            </div>
                        </div>
                        <p class="text-[10px] text-neutral-600 text-right mt-1 font-mono">Input the final amount to charge.</p>
                    </div>
                </div>
            `;
        }

        window.renderBuilderItems = (type) => {
            const listId = type === 'quote' ? 'qb-items-list' : 'bb-items-list';
            document.getElementById(listId).innerHTML = builderItems.map((item, idx) => {
                const isCabinet = item.category === 'CABINET';
                let presetOptions = '';
                
                // AUTO-LEARN DATALIST GENERATION
                const catKey = item.category;
                const suggestions = state.componentLibrary[catKey] || [];
                const listId = `list-${catKey.replace(/\s+/g, '-')}`;
                const datalistHTML = suggestions.length > 0 ? 
                    `<datalist id="${listId}">${suggestions.map(s => `<option value="${s}">`).join('')}</datalist>` : '';

                if (['MOUSE', 'KEYBOARD'].includes(item.category)) {
                    presetOptions = `<select onchange="window.updateItem(${idx}, 'name', this.value)" class="bg-[#111] border border-[#333] text-[#C5A059] text-[10px] font-bold uppercase py-2 px-3 h-full"><option value="">Select Option</option><option value="(COMPLIMENTARY)">(COMPLIMENTARY)</option></select>`;
                } else if (item.category === 'OTHERS') {
                    presetOptions = `<select onchange="window.updateItem(${idx}, 'name', this.value)" class="bg-[#111] border border-[#333] text-[#C5A059] text-[10px] font-bold uppercase py-2 px-3 h-full"><option value="">Select Option</option><option value="WINDOWS 11 & MS OFFICE (COMPLIMENTARY)">WIN 11 & OFFICE (FREE)</option></select>`;
                }

                return `
                <div class="p-3 flex flex-col md:flex-row gap-4 items-center group hover:bg-[#111] transition-colors">
                    ${isCabinet ? `
                    <div class="flex flex-col gap-2 shrink-0">
                        <div class="w-20 h-20 border border-[#333] bg-black flex items-center justify-center relative cursor-pointer hover:border-[#C5A059] transition-colors overflow-hidden" title="Click to upload">
                            ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-full h-full object-contain">` : `<i data-lucide="image-plus" class="text-neutral-600"></i>`}
                            <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="window.uploadItemImage(${idx}, this, '${type}')">
                        </div>
                    </div>` : `<div class="w-16 shrink-0"></div>`}
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-4 gap-4 w-full items-center">
                        <div class="md:col-span-1">
                            <div class="p-2 bg-[#050505] border border-[#222] text-[10px] font-bold text-[#8B6914] text-center uppercase tracking-[0.1em] font-mono">${item.category}</div>
                        </div>
                        <div class="md:col-span-3 flex gap-2 h-10">
                            <input id="item-input-${idx}" value="${item.name}" list="${listId}" oninput="window.updateItem(${idx}, 'name', this.value)" placeholder="Enter specification..." class="flex-1 p-2 bg-transparent border-b border-[#333] text-white focus:border-[#C5A059] outline-none font-tech text-lg placeholder-neutral-700 transition-colors uppercase">
                            ${datalistHTML}
                            ${presetOptions ? `<div class="shrink-0 h-full">${presetOptions}</div>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        window.updateItem = (idx, field, val) => {
            const upperVal = val.toUpperCase();
            builderItems[idx][field] = upperVal;
            if (field === 'name') {
                const el = document.getElementById(`item-input-${idx}`);
                if (el && el.value !== upperVal) el.value = upperVal;
            }
        };
        
        window.uploadItemImage = (idx, input, type) => { 
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { builderItems[idx].imageUrl = e.target.result; renderBuilderItems(type); };
                reader.readAsDataURL(input.files[0]);
            }
        };

        // --- SAVE LOGIC ---
        window.saveQuote = () => {
            const cName = document.getElementById('quote-c-name').value;
            const total = parseFloat(document.getElementById('quote-manual-total').value);
            const dateInput = document.getElementById('quote-date').value;
            const validInput = document.getElementById('quote-valid').value;

            if(!cName) return alert('Input Client Name'); 
            if(isNaN(total)) return alert('Input Total');
            
            // AUTO-LEARN
            updateLibrary(builderItems);

            let quoteId = state.editingQuote ? state.editingQuote.quoteNumber : null;
            if (!quoteId) {
                const cleanPhone = document.getElementById('quote-c-contact').value.replace(/\D/g, '').slice(-10) || '0000';
                const parts = dateInput.split('-'); 
                const dayMonth = parts.length >= 3 ? `${parts[2]}${parts[1]}` : '0101'; 
                const lastFour = cleanPhone.slice(-4);
                quoteId = `${dayMonth}/${lastFour}`;
            }
            
            const quote = { 
                id: state.editingQuote ? state.editingQuote.id : 'q_' + Date.now(), 
                quoteNumber: quoteId, 
                clientName: cName.toUpperCase(), 
                clientContact: document.getElementById('quote-c-contact').value, 
                items: builderItems, 
                total: total, 
                quoteDate: dateInput,
                validUntil: validInput,
                gstApplied: true, // PERMANENT GST
                createdAt: new Date().toISOString() 
            };
            
            if(state.editingQuote) { state.quotations[state.quotations.findIndex(q => q.id === quote.id)] = quote; } 
            else { state.quotations.push(quote); }
            saveData(); 
            navigateTo('quotes');
        };

        window.saveManualBill = () => {
            const cName = document.getElementById('bill-c-name').value;
            const total = parseFloat(document.getElementById('bill-manual-total').value);
            const dateInput = document.getElementById('bill-date').value;

            if(!cName) return alert('Input Client Name'); 
            if(isNaN(total)) return alert('Input Total');
            
            // AUTO-LEARN
            updateLibrary(builderItems);

            let invoiceId = state.editingBill && state.editingBill.invoiceNumber ? state.editingBill.invoiceNumber : null;
            if(!invoiceId) {
                const cleanPhone = document.getElementById('bill-c-contact').value.replace(/\D/g, '').slice(-10) || '0000';
                const parts = dateInput.split('-'); 
                const dayMonth = parts.length >= 3 ? `${parts[2]}${parts[1]}` : '0101'; 
                const lastFour = cleanPhone.slice(-4);
                invoiceId = `${dayMonth}/${lastFour}`;
            }

            const newBill = {
                id: state.editingBill && state.editingBill.id ? state.editingBill.id : 'bill_' + Date.now(),
                invoiceNumber: invoiceId,
                clientName: cName.toUpperCase(),
                clientContact: document.getElementById('bill-c-contact').value,
                items: builderItems,
                total: total,
                date: dateInput,
                gstApplied: true, // PERMANENT GST
                createdAt: new Date().toISOString()
            };

            if(state.editingBill && state.editingBill.id) {
                state.bills[state.bills.findIndex(b => b.id === newBill.id)] = newBill;
            } else {
                state.bills.push(newBill);
            }
            saveData();
            
            if(confirm('Invoice Saved Successfully! View it now?')) {
                window.viewQuote(newBill.id, 'saved-bill');
            } else {
                navigateTo('billing');
            }
        };

        // --- QUOTES LIST ---
        function renderQuotesList(filteredData = null) {
            const dataToShow = filteredData || state.quotations;
            dataToShow.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

            dom.views.quotes.innerHTML = `
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-2xl font-black text-white font-tech uppercase italic">Transaction Logs</h2>
                    <div class="relative w-full max-w-md">
                        <i data-lucide="search" class="absolute left-3 top-3 text-neutral-500 w-5 h-5"></i>
                        <input type="text" onkeyup="window.handleSearch(this.value)" placeholder="Search..." 
                            class="w-full bg-[#080808] border border-[#222] text-white rounded-none pl-10 pr-4 py-2 focus:border-[#C5A059] outline-none font-tech tracking-wide placeholder-neutral-600 transition-colors">
                    </div>
                </div>
                <div class="bg-[#0c0c0c] border border-[#222] overflow-hidden">
                    <table class="w-full text-left text-sm text-neutral-400">

                            <tr><th class="p-4">Date</th><th class="p-4">Ref ID</th><th class="p-4">Client</th><th class="p-4 text-right">Value</th><th class="p-4 text-right">Ops</th></tr>
                        </thead>
                        <tbody class="divide-y divide-[#1a1a1a]" id="quotes-table-body"></tbody>
                    </table>
                </div>`;
            renderQuoteRows(dataToShow);
            lucide.createIcons();
        }

        function renderQuoteRows(data) {
            const tbody = document.getElementById('quotes-table-body');
            if(!tbody) return;
            if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-neutral-600 font-mono text-xs">NO RECORDS FOUND</td></tr>`; return; }

            tbody.innerHTML = data.map(q => `
                <tr class="hover:bg-[#111] transition-colors">
                    <td class="p-4 font-mono text-xs">${formatDate(q.quoteDate)}</td>
                    <td class="p-4 font-bold text-[#8B6914] font-mono text-xs">${q.quoteNumber}</td>
                    <td class="p-4 font-bold text-white font-tech uppercase">${q.clientName}</td>
                    <td class="p-4 text-right font-bold font-tech text-lg text-[#C5A059]">₹${formatCurrency(q.total)}</td>
                    <td class="p-4 text-right flex justify-end gap-2">
                        <button onclick="window.convertQuoteToBill('${q.id}')" title="Convert to Bill" class="text-green-500 hover:text-green-300 transition-colors border border-green-900 bg-[#050505] px-2 py-1 rounded text-[10px] uppercase font-bold tracking-wider flex items-center gap-1">
                            <i data-lucide="arrow-right-circle" size="14"></i> Bill
                        </button>
                        <button onclick="window.editQuote('${q.id}')" class="text-blue-500 hover:text-white transition-colors"><i data-lucide="pencil" size="16"></i></button>
                        <button onclick="window.viewQuote('${q.id}', 'quote')" class="text-neutral-500 hover:text-[#C5A059] transition-colors"><i data-lucide="printer" size="16"></i></button>
                        <button onclick="window.deleteQuote('${q.id}')" class="text-red-800 hover:text-red-500 transition-colors"><i data-lucide="trash-2" size="16"></i></button>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        window.handleSearch = (query) => {
            const lowerQuery = query.toLowerCase();
            const filtered = state.quotations.filter(q => {
                return (q.clientName.toLowerCase().includes(lowerQuery) || q.quoteNumber.toLowerCase().includes(lowerQuery) || formatDate(q.quoteDate).includes(lowerQuery) || q.total.toString().includes(lowerQuery));
            });
            renderQuoteRows(filtered);
        };

        window.editQuote = (id) => { state.editingQuote = state.quotations.find(q => q.id === id); navigateTo('create'); };
        window.deleteQuote = (id) => { if(confirm('Delete record?')) { state.quotations = state.quotations.filter(q => q.id !== id); saveData(); renderQuotesList(); } };

        window.convertQuoteToBill = (quoteId) => {
            const quote = state.quotations.find(q => q.id === quoteId);
            if(!quote) return;
            state.editingBill = JSON.parse(JSON.stringify(quote));
            state.editingBill.id = null; 
            state.editingBill.invoiceNumber = null;
            state.editingBill.date = new Date().toISOString().split('T')[0];
            navigateTo('createBill');
            setTimeout(() => alert('Quote converted! You can now edit the Invoice details before saving.'), 100);
        };

        // --- VIEW DOCUMENT LOGIC ---
        window.viewQuote = (id, type) => {
            let dataObject = null;
            let docTitle = 'QUOTATION';
            let idLabel = 'REF ID';
            let displayId = '';
            
            const isBill = type === 'bill' || type === 'saved-bill';

            if (type === 'saved-bill') {
                dataObject = state.bills.find(b => b.id === id);
                docTitle = 'TAX INVOICE';
                idLabel = 'INVOICE NO';
                displayId = dataObject ? dataObject.invoiceNumber : '';
            } else {
                dataObject = state.quotations.find(q => q.id === id);
                if (type === 'bill') { docTitle = 'TAX INVOICE'; idLabel = 'INVOICE NO'; }
                displayId = dataObject ? dataObject.quoteNumber : '';
            }

            if(!dataObject) return;
            
            const safeId = displayId.replace(/\//g, '-');
            document.title = isBill ? `ACE Invoice - ${safeId}` : `ACE Quotation - ${safeId}`;

            dom.quoteViewer.classList.remove('hidden');
            dom.btnViewerBack.onclick = () => { dom.quoteViewer.classList.add('hidden'); document.title = "ACE Computech"; };

            const s = state.settings;
            const cabinetItem = dataObject.items.find(i => i.category.includes('CABINET'));
            const cabinetImg = cabinetItem && cabinetItem.imageUrl ? cabinetItem.imageUrl : null;
            
            const dateDisplay = isBill 
                ? `<span class="text-black">Date:</span> ${formatDate(dataObject.date)}`
                : `<span class="text-black">Date:</span> ${formatDate(dataObject.quoteDate)} <span class="mx-1">|</span> <span class="text-black">Valid:</span> ${formatDate(dataObject.validUntil)}`;

            let footerContent = '';

            if (isBill) {
                let taxBlockHtml = ''; 
                if (dataObject.gstApplied) {
                    const baseAmount = totalAmount / 1.18;
                    const totalTax = totalAmount - baseAmount;
                    const cgst = totalTax / 2;
                    const sgst = totalTax / 2;
                    taxBlockHtml = `
                        <div class="text-[14px] font-mono text-black font-bold space-y-2 text-right mr-8">
                            <div class="flex gap-4 border-b-2 border-black pb-1 mb-1 justify-end"><span class="w-32 text-left">TAXABLE VALUE:</span> <span>₹${formatCurrency(baseAmount.toFixed(2))}</span></div>
                            <div class="flex gap-4 justify-end"><span class="w-32 text-left">CGST (9%):</span> <span>₹${formatCurrency(cgst.toFixed(2))}</span></div>
                            <div class="flex gap-4 justify-end"><span class="w-32 text-left">SGST (9%):</span> <span>₹${formatCurrency(sgst.toFixed(2))}</span></div>

                footerContent = `

                            </div>
                        </div>
                    </div>`;
            } else {
                footerContent = `
                    <div class="mt-auto border-t-2 border-black pt-4 flex justify-between items-end shrink-0">
                        <div class="text-[11px] leading-relaxed text-black w-1/2">
                            <p class="font-bold text-black uppercase mb-2 tracking-widest border-b border-neutral-200 pb-0.5 inline-block">Terms & Conditions</p>
                            <ul class="list-disc pl-4 space-y-1"><li>Pricing is inclusive of GST (18%) where applicable.</li><li>50% advance payment required for order confirmation.</li><li>Warranty as per manufacturer policy.</li><li>Goods once sold cannot be returned.</li></ul>
                        </div>
                        <div class="w-1/2 flex justify-end">
                            <div class="text-right">
                                <p class="text-[11px] uppercase tracking-[0.2em] font-bold text-black">Total Amount</p>
                                <div class="text-7xl font-black font-tech print-gold-text tracking-tighter leading-none mt-1">₹${formatCurrency(totalAmount)}</div>
                            </div>
                        </div>
                    </div>`;
            }

            dom.quoteViewerContent.innerHTML = `
                <div class="h-full w-full flex flex-row font-sans text-black relative">
                    <div class="w-[35%] print:w-[35%] flex flex-col print-sidebar border-r border-[#C5A059] relative text-white h-full">
                        <div class="h-32 w-full flex flex-col justify-center items-center relative p-4 shrink-0 border-b border-[#222] bg-transparent">
                             ${s.logoUrl ? `<img src="${s.logoUrl}" class="h-full w-full object-contain bg-transparent">` : `<h1 class="text-7xl font-black font-tech italic text-gold-metallic leading-none tracking-tighter" style="transform: skew(-10deg);">ACE</h1>`}
                        </div>
                        <div class="flex-1 flex flex-col p-4 items-center justify-center relative">
                            <div class="w-full text-center pb-2 mb-2"><p class="text-[14px] font-bold uppercase tracking-[0.2em] print-gold-text">System Chassis</p></div>
                            <div class="w-full flex items-center justify-center">${cabinetImg ? `<img src="${cabinetImg}" class="w-[90%] max-h-[500px] object-contain drop-shadow-2xl z-10">` : `<p class="text-neutral-500 text-xs font-mono">NO VISUAL</p>`}</div>
                        </div>
                        <div class="p-6 border-t border-[#222] bg-[#0c0c0c] shrink-0">
                             <p class="text-sm uppercase tracking-widest text-neutral-400 mb-2">Prepared For</p>
                             <p class="font-bold text-4xl uppercase font-tech text-white leading-none truncate w-full mb-1">${dataObject.clientName}</p>
                             <div class="mt-4 text-base text-neutral-400 font-mono space-y-1"><p class="print-gold-text font-bold tracking-widest text-sm">${displayId}</p></div>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col p-6 bg-white relative h-full">
                        <div class="tech-corner-tl print-border-gold"></div>
                        <div class="tech-corner-br print-border-gold"></div>

                            <div><h1 class="text-5xl font-black font-tech uppercase tracking-tighter text-black leading-none">${docTitle}</h1><p class="text-sm font-bold print-gold-bg uppercase tracking-wide bg-black inline-block text-white px-3 py-1 mt-2 whitespace-nowrap">${idLabel}: ${displayId}</p></div>

                                        ${s.gst ? `<p>${s.gst}</p><p class="text-black">|</p>` : ''}
                                        <p>${(s.phone || '').replace(/-/g, '')}</p><p class="text-black">|</p><p>${s.email}</p>
                                    </div>

                            </div>
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <table class="w-full text-sm border-collapse table-fixed table-clean">
                                <thead><tr class="print-black-header text-xs uppercase tracking-[0.15em] font-tech"><th class="p-2 text-left w-[25%] print-col-border">Component</th><th class="p-2 text-left w-[75%]">Specification / Model</th></tr></thead>
                                <tbody>${dataObject.items.map((item, i) => `<tr class="${i % 2 === 0 ? 'bg-white' : 'bg-neutral-100'} print-row-border"><td class="py-1.5 px-2 font-bold text-black uppercase text-xs tracking-wide font-tech print-col-border">${item.category}</td><td class="py-1.5 px-2 font-semibold text-black font-tech text-sm truncate leading-tight">${item.name || '-'}</td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                        ${footerContent}
                    </div>
                </div>`;
        };

        // --- SETTINGS ---
        function renderSettings() {
            const s = state.settings;
            dom.views.settings.innerHTML = `
                <h2 class="text-3xl font-black text-white mb-8 font-tech uppercase italic">System <span class="text-gold-metallic">Settings</span></h2>

                                <div>
                                    <input type="file" accept="image/*" onchange="window.handleImageUpload(this, 'settings-logo-preview', (url) => window.tempLogoUrl = url)" class="block w-full text-sm text-neutral-500 file:mr-4 file:py-2 file:px-4 file:bg-gold-gradient file:text-white file:font-bold file:border-0 hover:file:brightness-110 cursor-pointer mb-2">
                                    <p class="text-[10px] text-neutral-500">Upload the "ACE" Gold Logo for Print Headers.</p>
                                </div>
                            </div>
                        </div>
                        <div><label class="block text-xs font-bold mb-1 text-neutral-500 uppercase tracking-widest">Company Name</label><input name="companyName" value="${s.companyName}" class="w-full p-3 bg-black border border-[#333] text-white focus:border-[#C5A059] outline-none font-tech text-lg transition-colors"></div>
                        <div><label class="block text-xs font-bold mb-1 text-neutral-500 uppercase tracking-widest">Address Line</label><textarea name="address" class="w-full p-3 bg-black border border-[#333] text-white focus:border-[#C5A059] outline-none font-sans text-sm transition-colors" rows="2">${s.address}</textarea></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs font-bold mb-1 text-neutral-500 uppercase tracking-widest">Phone</label><input name="phone" value="${s.phone}" class="w-full p-3 bg-black border border-[#333] text-white focus:border-[#C5A059] outline-none font-mono transition-colors"></div>
                            <div><label class="block text-xs font-bold mb-1 text-neutral-500 uppercase tracking-widest">Email</label><input name="email" value="${s.email}" class="w-full p-3 bg-black border border-[#333] text-white focus:border-[#C5A059] outline-none font-mono transition-colors"></div>
                            <div class="col-span-2"><label class="block text-xs font-bold mb-1 text-neutral-500 uppercase tracking-widest">GSTIN</label><input name="gst" value="${s.gst || ''}" placeholder="Enter GST Number" class="w-full p-3 bg-black border border-[#333] text-white focus:border-[#C5A059] outline-none font-mono transition-colors"></div>
                        </div>
                    </div>
                    <button type="submit" class="bg-gold-gradient text-white font-black uppercase font-tech tracking-wider px-8 py-3 hover:brightness-110 w-full mb-4 rounded-sm shadow-md">Save Configuration</button>
                </form>
                
                <div class="mt-10 border-t border-[#222] pt-10 pb-10 max-w-2xl">
                    <h3 class="text-xl font-bold text-red-500 font-tech uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="alert-triangle"></i> Danger Zone
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-[#1a0505] border border-red-900/30 p-6">
                            <h4 class="text-red-400 font-bold uppercase text-sm mb-2">Clear Quotations</h4>
                            <p class="text-neutral-500 text-xs mb-4">Permanently delete all quotation history. This action cannot be undone.</p>
                            <button onclick="window.deleteAllQuotes()" class="border border-red-800 text-red-500 hover:bg-red-900/20 px-4 py-2 text-xs font-bold uppercase tracking-wider w-full transition-colors">
                                Delete All Quotes
                            </button>
                        </div>
                        <div class="bg-[#1a0505] border border-red-900/30 p-6">
                            <h4 class="text-red-400 font-bold uppercase text-sm mb-2">Clear Invoices</h4>
                            <p class="text-neutral-500 text-xs mb-4">Permanently delete all billing/invoice history. This action cannot be undone.</p>
                            <button onclick="window.deleteAllBills()" class="border border-red-800 text-red-500 hover:bg-red-900/20 px-4 py-2 text-xs font-bold uppercase tracking-wider w-full transition-colors">
                                Delete All Invoices
                            </button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.saveSettings = (e) => {
            e.preventDefault(); const fd = new FormData(e.target);
            state.settings = { ...state.settings, companyName: fd.get('companyName'), address: fd.get('address'), phone: fd.get('phone'), email: fd.get('email'), gst: fd.get('gst') };
            if(window.tempLogoUrl) { state.settings.logoUrl = window.tempLogoUrl; window.tempLogoUrl = null; }
            saveData(); alert('System Updated');
        };

        window.deleteAllQuotes = () => {
            if(confirm('CRITICAL WARNING: Are you sure you want to DELETE ALL QUOTATIONS? This cannot be undone.')) {
                if(confirm('Please confirm again: Delete entire quotation history?')) {
                    state.quotations = [];
                    saveData();
                    alert('All quotations have been deleted.');
                }
            }
        };

        window.deleteAllBills = () => {
            if(confirm('CRITICAL WARNING: Are you sure you want to DELETE ALL INVOICES? This cannot be undone.')) {
                if(confirm('Please confirm again: Delete entire invoice history?')) {
                    state.bills = [];
                    saveData();
                    alert('All invoices have been deleted.');
                }
            }
        };

        window.handleImageUpload = (input, previewId, callback) => {
            if(input.files && input.files[0]) {
                const reader = new FileReader(); 
                reader.readAsDataURL(input.files[0]);
                reader.onload = (e) => {
                    const img = new Image(); 
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); 
                        let w=img.width, h=img.height, m=300; 
                        if(w>h){if(w>m){h*=m/w;w=m}}else{if(h>m){w*=m/h;h=m}}
                        canvas.width=w;canvas.height=h; 
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, w, h);
                        ctx.drawImage(img,0,0,w,h);
                        const url = canvas.toDataURL('image/png'); 
                        if(previewId) document.getElementById(previewId).innerHTML = `<img src="${url}" class="h-full w-full object-contain">`;
                        if(callback) callback(url);
                    }
                }
            }
        };

        init();
    </script>
</body>
</html>
